name: Build Somoy Sutra Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Install Electron
        run: npm install --save-dev electron electron-builder

      - name: Create Electron main file
        shell: pwsh
        run: |
          @'
          const { app, BrowserWindow, dialog } = require('electron');
          const path = require('path');

          const PORT = 47821;

          async function waitForServer() {
            for (let i = 0; i < 60; i++) {
              try {
                const response = await fetch(
                  `http://127.0.0.1:${PORT}/api/health`
                );

                if (response.ok) return true;
              } catch (e) {}

              await new Promise(resolve => setTimeout(resolve, 500));
            }

            return false;
          }

          async function startServer() {
            process.env.NODE_ENV = 'production';
            process.env.PORT = String(PORT);

            await import(
              path.join(__dirname, 'dist', 'server.js')
            );
          }

          async function createWindow() {
            const win = new BrowserWindow({
              width: 1440,
              height: 900,
              minWidth: 1100,
              minHeight: 700,

              autoHideMenuBar: true,

              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false
              }
            });

            const ready = await waitForServer();

            if (!ready) {
              dialog.showErrorBox(
                'Somoy Sutra',
                'Local server চালু করা সম্ভব হয়নি।'
              );

              app.quit();
              return;
            }

            await win.loadURL(
              `http://127.0.0.1:${PORT}`
            );
          }

          app.whenReady().then(async () => {
            await startServer();
            await createWindow();

            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) {
                createWindow();
              }
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          '@ | Set-Content -Path main.cjs -Encoding UTF8

      - name: Configure Electron Builder
        shell: pwsh
        run: |
          node -e "
          const fs = require('fs');

          const p = JSON.parse(
            fs.readFileSync('package.json', 'utf8')
          );

          p.main = 'main.cjs';

          p.scripts = {
            ...p.scripts,
            'electron:build': 'electron-builder --win'
          };

          p.build = {
            appId: 'com.somoysutra.newseditor',
            productName: 'Somoy Sutra AI News Editor',

            directories: {
              output: 'release'
            },

            files: [
              'dist/**/*',
              'main.cjs',
              'package.json',
              'node_modules/**/*'
            ],

            win: {
              target: [
                {
                  target: 'nsis',
                  arch: ['x64']
                },
                {
                  target: 'portable',
                  arch: ['x64']
                }
              ]
            },

            nsis: {
              oneClick: false,
              allowToChangeInstallationDirectory: true,
              createDesktopShortcut: true,
              createStartMenuShortcut: true
            }
          };

          fs.writeFileSync(
            'package.json',
            JSON.stringify(p, null, 2)
          );
          "

      - name: Build Windows EXE
        run: npm run electron:build

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Somoy-Sutra-Windows
          path: release/*
